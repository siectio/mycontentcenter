<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Command Center</title>
  <style>
    :root {
      --bg-app: #F8FAFC;
      --surface: #FFFFFF;
      --surface-muted: #F1F5F9;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border: #E2E8F0;

      --color-brand: #0F172A;
      --color-personal: #D97706;
      --color-personal-bg: #FEF3C7;
      --color-devimpact: #0F766E;
      --color-devimpact-bg: #CCFBF1;
      --color-product: #4F46E5;
      --color-product-bg: #E0E7FF;
      --color-danger: #DC2626;
      --color-danger-bg: #FEE2E2;
      --color-success: #16A34A;
      --color-success-bg: #DCFCE7;

      --sidebar-w: 245px;
      --radius: 10px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      line-height: 1.5;
      font-size: 14px;
    }

    .app-shell { display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 40;
      transition: transform 0.2s ease;
    }

    .sidebar-header { padding: 18px 20px; border-bottom: 1px solid var(--border); }
    .sidebar-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .sidebar-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .nav-list { list-style: none; padding: 12px 10px; flex: 1; overflow-y: auto; }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 3px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover { background: var(--surface-muted); color: var(--text-primary); }
    .nav-item.active { background: var(--color-brand); color: #FFFFFF; }

    .nav-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }

    .phase-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--surface-muted);
      color: var(--text-secondary);
    }
    .nav-item.active .phase-tag { background: rgba(255, 255, 255, 0.2); color: #FFFFFF; }

    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-left { display: flex; align-items: center; gap: 12px; }

    .menu-btn {
      display: none;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .page-heading { font-size: 17px; font-weight: 700; }
    .date-meta { font-size: 12px; color: var(--text-secondary); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .content-area { padding: 20px 24px 48px; max-width: 1260px; width: 100%; margin: 0 auto; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
      text-decoration: none;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--color-brand); color: #FFFFFF; }
    .btn-primary:hover { opacity: 0.92; }
    .btn-personal { background: var(--color-personal); color: #FFFFFF; }
    .btn-devimpact { background: var(--color-devimpact); color: #FFFFFF; }
    .btn-product { background: var(--color-product); color: #FFFFFF; }
    .btn-secondary { background: var(--surface); border-color: var(--border); color: var(--text-primary); }
    .btn-secondary:hover { background: var(--surface-muted); }
    .btn-danger { background: var(--color-danger-bg); color: var(--color-danger); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-chip {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 99px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      color: var(--text-primary);
      cursor: pointer;
      font-weight: 600;
    }
    .btn-chip:hover, .btn-chip.active {
      background: var(--color-brand);
      color: #FFFFFF;
      border-color: var(--color-brand);
    }

    .input, .select, .textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      background: var(--surface);
      color: var(--text-primary);
    }
    .textarea { resize: vertical; line-height: 1.5; }
    .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--color-product); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 18px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }

    .kpi-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }
    .kpi-label { font-size: 11.5px; color: var(--text-secondary); font-weight: 600; }
    .kpi-value { font-size: 22px; font-weight: 800; margin-top: 2px; color: var(--text-primary); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
    }
    .card-alert { border-left: 4px solid var(--color-danger); }
    .card-personal { border-top: 4px solid var(--color-personal); }
    .card-devimpact { border-top: 4px solid var(--color-devimpact); }
    .card-product { border-top: 4px solid var(--color-product); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-title { font-size: 14.5px; font-weight: 700; color: var(--text-primary); }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 18px 0 8px;
    }

    .quick-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .quick-bar .input { flex: 1; min-width: 200px; }
    .quick-bar .select { width: auto; min-width: 145px; }

    .subtabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-personal { background: var(--color-personal-bg); color: var(--color-personal); }
    .badge-devimpact { background: var(--color-devimpact-bg); color: var(--color-devimpact); }
    .badge-product { background: var(--color-product-bg); color: var(--color-product); }
    .badge-general { background: var(--surface-muted); color: var(--text-secondary); }
    .badge-high { background: var(--color-danger-bg); color: var(--color-danger); }
    .badge-medium { background: #FEF3C7; color: #B45309; }
    .badge-low { background: var(--surface-muted); color: var(--text-secondary); }
    .badge-done { background: var(--color-success-bg); color: var(--color-success); }
    .badge-series { background: #F3E8FF; color: #7E22CE; }

    .task-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .task-item:last-child { border-bottom: none; }

    .task-left { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
    .task-checkbox { width: 17px; height: 17px; margin-top: 2px; cursor: pointer; accent-color: var(--color-brand); }
    .task-title { font-weight: 600; font-size: 13.5px; word-break: break-word; }
    .task-title.done { text-decoration: line-through; color: var(--text-muted); }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 5px;
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .snippet-box {
      margin-top: 6px;
      font-size: 12.5px;
      color: var(--text-secondary);
      background: var(--bg-app);
      padding: 8px 10px;
      border-radius: 6px;
      white-space: pre-line;
      max-height: 110px;
      overflow-y: auto;
    }

    .milestone-panel {
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 12px;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(150px, 1fr));
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .day-col {
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      min-height: 220px;
    }
    .day-col.today {
      border: 2px solid var(--color-product);
      background: #F5F7FF;
    }
    .day-col-header {
      font-weight: 700;
      font-size: 12px;
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .cal-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--color-brand);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 6px;
      font-size: 11.5px;
      box-shadow: var(--shadow-sm);
    }
    .cal-pill.personal { border-left-color: var(--color-personal); }
    .cal-pill.devimpact { border-left-color: var(--color-devimpact); }
    .cal-pill.product { border-left-color: var(--color-product); }

    .progress-wrap { background: var(--surface-muted); height: 8px; border-radius: 99px; overflow: hidden; margin: 8px 0; }
    .progress-fill { background: var(--color-product); height: 100%; transition: width 0.3s ease; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: var(--shadow-md);
    }
    .modal-box.modal-wide { max-width: 980px; }

    .editor-split { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 18px; }

    .ai-panel { background: var(--bg-app); border: 1px solid var(--border); border-radius: 9px; padding: 14px; }
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }

    .prompt-preview {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #0F172A;
      color: #F8FAFC;
      padding: 10px 12px;
      border-radius: 7px;
      min-height: 120px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-bottom: 8px;
    }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--color-brand);
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 80;
    }
    .toast.show { opacity: 1; }

    .empty-state { text-align: center; padding: 24px 12px; color: var(--text-muted); font-size: 13px; }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      z-index: 35;
    }

    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop.open { display: block; }
      .main-wrapper { margin-left: 0; }
      .menu-btn { display: inline-flex; }
      .grid-2, .grid-3, .grid-4, .editor-split, .form-row { grid-template-columns: 1fr; }
      .content-area { padding: 14px; }
      .topbar { padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">MY COMMAND CENTER</div>
        <div class="sidebar-subtitle">Personal Operating System v1.0</div>
      </div>

      <ul class="nav-list" id="navList">
        <li class="nav-item active" data-view="today" onclick="navigateTo('today')">
          <span>Today's Focus</span>
          <span class="phase-tag">Live</span>
        </li>
        <li class="nav-item" data-view="ideas" onclick="navigateTo('ideas')">
          <span>Idea Management</span>
          <span class="phase-tag">Live</span>
        </li>
        <li class="nav-item" data-view="personal" onclick="navigateTo('personal')">
          <span><span class="nav-dot" style="background:var(--color-personal)"></span>Personal Threads</span>
          <span class
